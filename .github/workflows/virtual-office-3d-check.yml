name: Virtual Office 3D checks
on:
  pull_request:
    paths:
      - "index.html"
      - "backend/worker.js"
      - "virtual-office-3d.js"
      - "VIRTUAL_OFFICE_3D.md"
      - ".github/workflows/virtual-office-3d-check.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "backend/worker.js"
      - "virtual-office-3d.js"
      - "VIRTUAL_OFFICE_3D.md"
      - ".github/workflows/virtual-office-3d-check.yml"
jobs:
  syntax-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend syntax and multi-LLM routing
        run: |
          node --check backend/worker.js
          grep -q 'async function callProvider' backend/worker.js
          grep -q 'AGENT_PROVIDER_PREFERENCES' backend/worker.js
          grep -q 'async function delegateAgent' backend/worker.js
          grep -q 'path === "/api/agents/delegate"' backend/worker.js
          grep -q 'INVALID_DELEGATION_INPUT' backend/worker.js
          grep -q 'claudeConfigured' backend/worker.js
          grep -q 'geminiConfigured' backend/worker.js
          grep -q 'result.provider' index.html
      - name: Smoke test deployed Worker health
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://appdigi-w001-backend.dickv940.workers.dev/health', { signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Worker health returned HTTP ${response.status}`);
          const data = await response.json();
          if (data.ok !== true || data.service !== 'appdigi-w001-worker') {
            throw new Error('Worker health payload did not match the expected service.');
          }
          if (data.llmMode !== 'workers-ai-only' ||
              data.model !== '@cf/google/gemma-4-26b-a4b-it' ||
              data.freeAIBudgetGuard !== true ||
              data.externalProvidersDisabled !== true ||
              data.dailyInferenceLimit !== 40 ||
              data.maxOutputTokens !== 600) {
            throw new Error('Live Worker is not in the expected Rp0-only AI mode.');
          }
          console.log('Live Worker Workers-AI-only mode and budget guard passed; provider secret values were not read or logged.');
          NODE
      - name: Check module syntax
        run: node --input-type=module --check < virtual-office-3d.js
      - name: Check integration hooks
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = readFileSync('index.html', 'utf8');
          const js = readFileSync('virtual-office-3d.js', 'utf8');
          assert.match(html, /id="virtualOffice3d"/);
          assert.match(html, /src="\.\/virtual-office-3d\.js(?:\?[^"]*)?"/);
          assert.match(html, /appdigi:room-open/);
          assert.match(html, /appdigi:room-close/);
          assert.match(html, /id="vo3dCctvToggle"/);
          assert.match(html, /id="vo3dCctvTarget"/);
          assert.match(html, /id="vo3dCctvZoom"/);
          assert.match(html, /appdigi:cctv-room-select/);
          assert.match(html, /id="appLoginGate"/);
          assert.match(html, /id="appLoginToken"/);
          assert.match(html, /id="appLoginForm"/);
          assert.ok(html.includes("/api/session"));
          assert.match(html, /sessionStorage\.setItem\(KEY,token\)/);
          assert.match(html, /id="agentMonitorRun"/);
          assert.match(html, /id="agentMonitorTaskInput"/);
          assert.match(html, /mode:"single",agentId:id/);
          assert.ok(html.includes("window.__appdigiAgentMonitor.lastRun"));
          assert.ok(html.includes(".agent-monitor-overlay[hidden]"));
          assert.match(js, /OrbitControls/);
          assert.match(js, /function toggleCctv/);
          assert.match(js, /function focusCctvTarget/);
          assert.match(js, /attachActorFocus/);
          assert.match(js, /prefers-reduced-motion:\s*reduce/);
          assert.match(js, /appdigi_officeme_workers_v1/);
          assert.match(js, /bukan aktivitas AI nyata/);
          console.log('Virtual Office 3D syntax and integration hooks passed.');
          NODE
