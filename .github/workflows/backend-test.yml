name: backend-test
on:
  push:
    paths: ["backend/**", ".github/workflows/backend-test.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check backend/worker.js
      - run: node --test backend/test/*.test.mjs
